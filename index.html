<!DOCTYPE html>
<html>
<head>
<title>Birthday Surprise</title>

<style>
body{
    background:#ff7eb3;
    font-family:Arial,sans-serif;
    text-align:center;
    color:white;
    padding-top:100px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:25px;
    font-size:18px;
    cursor:pointer;
}

#message{
    display:none;
    margin-top:30px;
    font-size:20px;
}
</style>
</head>

<body>

<h1>🎂 Happy Birthday 🎂</h1>

<p>I've got a small surprise for you 😊</p>

<button onclick="showMessage()">
Open Surprise ✨
</button>

<div id="message">
    <h2>🌸 A Little Note 🌸</h2>

    <p>
       Wishing you a wonderful birthday filled with happiness,
       laughter, success, and beautiful memories.
    </p>

    <p>
       I'm glad our paths crossed. May the coming year bring
       everything you're hoping for and more.
    </p>

    <p><b>Have an amazing birthday! 🎉</b></p>
</div>

<script>
function showMessage() {
   document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
